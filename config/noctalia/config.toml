widget_order = [ "desktop-widget-0000000000000001", "desktop-widget-0000000000000002", "desktop-widget-0000000000000003" ]

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000001]
    box_height = 160.0
    box_width = 304.0
    cx = 1024.0
    cy = 112.0
    output = "DP-1"
    rotation = 0.0
    type = "clock"

        [desktop_widgets.widget.desktop-widget-0000000000000001.settings]
        background = false
        color = "on_surface_variant"
        font_family = "TeX Gyre Schola"
        format = "{:%A}"

    [desktop_widgets.widget.desktop-widget-0000000000000002]
    box_height = 48.0
    box_width = 224.0
    cx = 1024.0
    cy = 176.0
    output = "DP-1"
    rotation = 0.0
    type = "clock"

        [desktop_widgets.widget.desktop-widget-0000000000000002.settings]
        background = false
        font_family = "TeX Gyre Schola"
        format = "{:%d %b %y}"

    [desktop_widgets.widget.desktop-widget-0000000000000003]
    box_height = 96.0
    box_width = 288.0
    cx = 1024.0
    cy = 248.0
    output = "DP-1"
    rotation = 0.0
    type = "clock"

        [desktop_widgets.widget.desktop-widget-0000000000000003.settings]
        background = false
        font_family = "TeX Gyre Schola"
        format = "{:%H:%M:%S}"

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-1", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 1280.0
    cy = 1321.0
    output = "DP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_login_button = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 768.0
    cy = 841.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_login_button = true

[osd.kinds]
media = false

[plugins]
enabled = [ "noctalia/notes", "noctalia/timer" ]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

[shell]
app_icon_color = "primary"
font_family = "JetBrainsMono NF"

    [shell.panel]
    launcher_placement = "attached"
    wallpaper_placement = "centered"

    [shell.screenshot]
    directory = "/home/mischa/Pictures/Screenshots"

[theme]
builtin = "Rosé Pine"
community_palette = "Kanagawa Dragon"
custom_palette = "OccultUmbraNew"
mode = "dark"
source = "community"
wallpaper_scheme = "faithful"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "ghostty", "kcolorscheme", "kitty", "niri", "sway" ]
    community_ids = [ "vscode", "discord", "opencode", "papirus-icons" ]

[wallpaper.default]
path = "/home/mischa/Pictures/Wallpapers/wallhaven-jx9kxp.jpg"

[wallpaper.last]
path = "/home/mischa/Pictures/Wallpapers/wallhaven-jx9kxp.jpg"

[wallpaper.monitors.DP-1]
path = "/home/mischa/Pictures/Wallpapers/wallhaven-jx9kxp.jpg"

[wallpaper.monitors.eDP-1]
path = "/home/mischa/Pictures/Wallpapers/wallhaven-jx9kxp.jpg"

[widget.bar]
type = "noctalia/timer:bar"

[widget.battery]
hide_when_plugged = true

[widget.clock]
capsule_fill = "surface"
format = " {:%d.%m -  %H:%M}"

[widget.control-center]
custom_image = "/home/mischa/Pictures/NixOS.png"
custom_image_colorize = true
glyph = "snowflake"

[widget.cpu]
display = "text"

[widget.date]
anchor = true
scale = 1.05

[widget.line]
glyph = "minus-vertical"
interactive = false
type = "custom_button"

[widget.network]
show_label = false

[widget.notes]
type = "noctalia/notes:notes"

[widget.notes_2]
type = "noctalia/notes:notes"

[widget.taskbar]
capsule_radius = 3
group_by_workspace = true
hide_empty_workspaces = true
inactive_opacity = 0.80000000000000004
minimal = true
scale = 1.6000000000000001
show_active_indicator = false
show_window_title = true
workspace_label_placement = "inside"

[widget.temp]
display = "text"

[widget.tray]
drawer = true

[widget.volume]
show_label = false

[widget.weather]
show_condition = false

[widget.workspaces]
active_pill_size = 1.1499999999999999
capsule_radius = 3
empty_color = "surface"
focused_color = "#38383A"
inactive_pill_size = 1.1499999999999999
occupied_color = "surface"
scale = 1.3500000000000001
