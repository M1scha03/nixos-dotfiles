enabled = true
icon_size = 36
item_spacing = 4
launcher_position = "start"
layer = "overlay"
main_axis_padding = 8
margin_edge = 12
pinned = [
    "brave-browser",
    "kitty",
    "org.gnome.Nautilus",
    "org.gnome.Calculator",
    "org.gnome.Papers",
    "obsidian",
    "com.moonlight_stream.Moonlight",
    "steam",
    "vesktop"
]
reserve_space = false
show_dots = true
show_instance_count = false
smart_auto_hide = true

[location]
