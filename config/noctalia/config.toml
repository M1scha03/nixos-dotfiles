[backdrop]
enabled = true

[bar]
order = [ "normal" ]

    [bar.normal]
    background_opacity = 0.59999998658895493
    capsule_thickness = 0.89999998360872269
    center = [ "taskbar" ]
    concave_edge_corners = false
    end = [
        "group:g1",
        "notifications",
        "line",
        "battery",
        "network",
        "bluetooth",
        "volume",
        "brightness",
        "weather",
        "line",
        "clock"
    ]
    font_family = "Maple Mono NF"
    margin_ends = 0
    padding = 8
    panel_overlap = 0
    position = "bottom"
    radius = 0
    radius_bottom_left = 0
    radius_bottom_right = 0
    scale = 0.85000000521540642
    start = [ "control-center", "line", "temp", "cpu", "bar", "line", "media" ]
    widget_spacing = 8

        [[bar.normal.capsule_group]]
        accordion = true
        accordion_direction = "start"
        enabled = true
        fill = "surface_variant"
        id = "g1"
        members = [ "tray", "notes_2", "clipboard", "wallpaper" ]
        opacity = 0.0
        padding = 6.0

[battery.device."/org/freedesktop/UPower/devices/headset_dev_80_99_E7_8E_80_47"]
warning_threshold = 20

[control_center.calendar]
show_events_card = false

[desktop_widgets]
