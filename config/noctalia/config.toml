[backdrop]
enabled = true

[bar]
order = [ "normal" ]

    [bar.normal]
    background_opacity = 0.59999998658895493
    capsule_thickness = 0.75999998673796654
    center = [ "clock", "line", "date", "line", "weather" ]
    concave_edge_corners = false
    end = [
        "group:g1",
        "line",
        "privacy",
        "line",
        "battery",
        "network",
        "bluetooth",
        "volume",
        "brightness",
        "group:g2",
        "notifications"
    ]
    font_weight = 700
    margin_ends = 0
    padding = 16
    panel_overlap = 0
    position = "top"
    radius = 0
    radius_bottom_left = 0
    radius_bottom_right = 0
    scale = 0.85000000521540642
    start = [ "control-center", "taskbar", "line", "media" ]
    thickness = 30
    widget_spacing = 8

        [[bar.normal.capsule_group]]
        accordion = true
        accordion_direction = "start"
        enabled = true
        fill = "surface_variant"
        id = "g1"
        members = [ "tray", "notes_2", "clipboard", "wallpaper" ]
        opacity = 0.0
        padding = 6.0

        [[bar.normal.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "surface_variant"
        id = "g2"
        members = [ "headphonesymbol", "headphone_battery" ]
        opacity = 0.0
        padding = 6.0

[battery.device."/org/freedesktop/UPower/devices/headset_dev_80_99_E7_8E_80_47"]
